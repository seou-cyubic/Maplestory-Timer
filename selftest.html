<h1>Astra Web — 이식 검증</h1>
<p class="lead">
  브라우저 파이프라인을 저장된 실화면 표본에 돌려 기대값과 직접 대조합니다.
  <b>[실화면]</b>은 실제 게임 캡처, <b>[합성]</b>은 조건을 만들려고 이 파일이 편집한 이미지,
  <b>정보</b>는 합격 판정이 아닌 측정값입니다. 합성 통과를 실게임 정확도로 읽지 마세요.
  순수 판정 로직의 전체 표는 <code>node tools/state_tests.js</code>에 있습니다.
</p>
