[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-test"
version = "0.1.0"
description = "Read-only MapleStory screen observer"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "pillow", "windows-capture>=2.0.1", "rapidocr>=3.9", "onnxruntime"]

[project.scripts]
astra-test = "astra_test.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
